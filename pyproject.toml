[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-forge"
version = "0.1.0"
description = "Enterprise foundation for a multimodal digital forensics and fraud intelligence platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "AI_Forge Engineering" }]
dependencies = [
    "alembic>=1.14,<2.0",
    "celery>=5.4,<6.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "redis[hiredis]>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pillow>=12.3.0",
    "pypdf>=6.16.2",
    "pytesseract>=0.3.13",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "aiosqlite>=0.20,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "N", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
