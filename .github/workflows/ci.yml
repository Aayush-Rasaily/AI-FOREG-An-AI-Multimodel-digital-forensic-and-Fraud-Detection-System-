name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml

  docs:
    name: Documentation
    uses: ./.github/workflows/docs.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read

  docker:
    name: Containers
    uses: ./.github/workflows/docker.yml
    with:
      push: false
    permissions:
      contents: read
      packages: write

  quality-gate:
    name: Quality gate
    needs: [backend, frontend, docs, security, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: echo "Ruff, MyPy, pytest, Vitest, production build, docs, security scans, Alembic, OpenAPI, and container builds passed."
