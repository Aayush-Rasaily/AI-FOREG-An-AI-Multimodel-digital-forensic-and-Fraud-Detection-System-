name: Frontend quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, Vitest, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: /api/v1

      - name: Bundle verification
        run: |
          test -f dist/index.html
          test -d dist/assets
          python - <<'PY'
          from pathlib import Path
          dist = Path("dist")
          assets = list(dist.glob("assets/*"))
          if not assets:
              raise SystemExit("Frontend production bundle has no assets.")
          print(f"bundle_ok files={len(assets)}")
          PY

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14
