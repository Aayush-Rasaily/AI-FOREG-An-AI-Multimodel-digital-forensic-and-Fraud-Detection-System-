name: Docker images

on:
  workflow_call:
    inputs:
      push:
        description: Publish images to GHCR
        type: boolean
        default: false
      version:
        description: Semantic version tag (without v prefix)
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      push:
        description: Publish images to GHCR
        type: boolean
        default: false
      version:
        description: Semantic version tag (without v prefix)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build backend and frontend images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image namespace
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=${{ env.REGISTRY }}/${owner}/ai-forge-api" >> "$GITHUB_OUTPUT"
          echo "web=${{ env.REGISTRY }}/${owner}/ai-forge-frontend" >> "$GITHUB_OUTPUT"
          sha="${GITHUB_SHA::12}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="0.0.0-sha.${sha}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ inputs.push }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/backend.Dockerfile
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          platforms: ${{ inputs.push && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.api }}:latest
          provenance: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/frontend.Dockerfile
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          platforms: ${{ inputs.push && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.web }}:latest
          provenance: false

      - name: Container vulnerability scan (API)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Container vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
