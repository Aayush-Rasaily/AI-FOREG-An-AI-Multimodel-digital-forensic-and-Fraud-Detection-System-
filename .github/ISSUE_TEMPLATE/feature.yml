# Feature request

name: Feature request
description: Propose an additive change that stays backward compatible
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the additive change. Forensic logic and investigation workflows must remain unchanged unless this is an explicit product request.
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: This request does not require breaking API, schema, or workflow changes
          required: true
