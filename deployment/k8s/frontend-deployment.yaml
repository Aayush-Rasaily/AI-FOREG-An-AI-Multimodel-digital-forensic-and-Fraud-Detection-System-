apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-forge-frontend
  namespace: ai-forge
  labels:
    app: ai-forge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-forge-frontend
  template:
    metadata:
      labels:
        app: ai-forge-frontend
    spec:
      containers:
        - name: frontend
          image: ai-forge-frontend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
