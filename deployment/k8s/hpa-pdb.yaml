apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-forge-backend-hpa
  namespace: ai-forge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-forge-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-forge-backend-pdb
  namespace: ai-forge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-forge-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-forge-worker-hpa
  namespace: ai-forge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-forge-worker
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-forge-worker-pdb
  namespace: ai-forge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-forge-worker
