apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-forge
  namespace: ai-forge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-forge.example.com
      secretName: ai-forge-tls
  rules:
    - host: ai-forge.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ai-forge-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-forge-frontend
                port:
                  number: 80
